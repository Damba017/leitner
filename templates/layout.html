<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{block "title" .}}Leitner{{end}}</title>
<link rel="stylesheet" href="/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#f6f8f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a19" media="(prefers-color-scheme: dark)">
<script src="/pwa.js" defer></script>
<script src="/theme.js"></script>
</head>
<body>
{{if .Me.ID}}
<header class="topbar">
  <nav class="menu" aria-label="Hoofdmenu">
    <a href="/">Leitner</a>
    <a href="/#/meldingen">Meldingen</a>
    <a href="/account"{{if eq .Nav "account"}} aria-current="page"{{end}}>Account</a>
    {{if .Me.IsAdmin}}<a href="/admin"{{if eq .Nav "admin"}} aria-current="page"{{end}}>Admin</a>{{end}}
  </nav>
  <div class="who">
    <label class="theme-pick">
      <span class="visually-hidden">Thema</span>
      <select id="theme">
        <option value="system">Thema: systeem</option>
        <option value="light">Thema: licht</option>
        <option value="dark">Thema: donker</option>
      </select>
    </label>
    <span class="muted">Ingelogd als {{.Me.Username}}</span>
    <form method="post" action="/logout"><button class="link">Uitloggen</button></form>
  </div>
</header>
{{end}}
<main class="page">
{{block "content" .}}{{end}}
</main>
</body>
</html>
{{define "messages"}}
{{with .Error}}<p class="error" role="alert">{{.}}</p>{{end}}
{{with .Notice}}<p class="notice" role="status">{{.}}</p>{{end}}
{{end}}
