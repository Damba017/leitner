{{define "title"}}Account aanmaken · Leitner{{end}}
{{define "content"}}
<div class="panel">
<h1>Account aanmaken</h1>
{{template "messages" .}}
<form method="post" action="/register" class="stack">
  <label for="username">Gebruikersnaam</label>
  <input id="username" name="username" value="{{.Username}}" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="3" maxlength="32" aria-describedby="username-hint" required>
  <p id="username-hint" class="hint">3–32 tekens: letters, cijfers, punt, _ en -.</p>
  <label for="email">E-mail</label>
  <input id="email" name="email" type="email" value="{{.Email}}" autocomplete="email" maxlength="254" aria-describedby="email-hint" required>
  <p id="email-hint" class="hint">Alleen om mee in te loggen; de app stuurt geen mail.</p>
  <label for="password">Wachtwoord</label>
  <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" aria-describedby="password-hint" required>
  <p id="password-hint" class="hint">Minstens 6 tekens.</p>
  <label for="password2">Herhaal wachtwoord</label>
  <input id="password2" name="password2" type="password" autocomplete="new-password" minlength="6" required>
  <button class="wide">Account aanmaken</button>
</form>
</div>
<p class="auth-alt">Al een account? <a href="/login">Inloggen</a></p>
{{end}}
